services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    environment:
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-streamtube}}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-streamtube}}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET_VIDEOS: ${STORAGE_BUCKET_VIDEOS:-videos}
      STORAGE_BUCKET_THUMBNAILS: ${STORAGE_BUCKET_THUMBNAILS:-thumbnails}
      STORAGE_PRESIGN_EXPIRY_SECONDS: ${STORAGE_PRESIGN_EXPIRY_SECONDS:-3600}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-10737418240}
      STORAGE_PART_SIZE_BYTES: ${STORAGE_PART_SIZE_BYTES:-67108864}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-streamtube}:${RABBITMQ_DEFAULT_PASS:-streamtube}@rabbitmq:5672}
      QUEUE_DELIVERY_LIMIT: ${QUEUE_DELIVERY_LIMIT:-3}
      QUEUE_CONSUMER_TIMEOUT_MS: ${QUEUE_CONSUMER_TIMEOUT_MS:-7200000}
      QUEUE_RETRY_DELAY_MS: ${QUEUE_RETRY_DELAY_MS:-30000}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
      WORKER_SCRATCH_DIR: ${WORKER_SCRATCH_DIR:-/tmp/streamtube-worker}
      VIDEO_DRAFT_TTL_HOURS: ${VIDEO_DRAFT_TTL_HOURS:-24}
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run start:worker:runtime
    restart: unless-stopped
    environment:
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-streamtube}}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-streamtube}}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET_VIDEOS: ${STORAGE_BUCKET_VIDEOS:-videos}
      STORAGE_BUCKET_THUMBNAILS: ${STORAGE_BUCKET_THUMBNAILS:-thumbnails}
      STORAGE_PRESIGN_EXPIRY_SECONDS: ${STORAGE_PRESIGN_EXPIRY_SECONDS:-3600}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-10737418240}
      STORAGE_PART_SIZE_BYTES: ${STORAGE_PART_SIZE_BYTES:-67108864}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_DEFAULT_USER:-streamtube}:${RABBITMQ_DEFAULT_PASS:-streamtube}@rabbitmq:5672}
      QUEUE_DELIVERY_LIMIT: ${QUEUE_DELIVERY_LIMIT:-3}
      QUEUE_CONSUMER_TIMEOUT_MS: ${QUEUE_CONSUMER_TIMEOUT_MS:-7200000}
      QUEUE_RETRY_DELAY_MS: ${QUEUE_RETRY_DELAY_MS:-30000}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
      WORKER_SCRATCH_DIR: ${WORKER_SCRATCH_DIR:-/tmp/streamtube-worker}
      VIDEO_DRAFT_TTL_HOURS: ${VIDEO_DRAFT_TTL_HOURS:-24}
    volumes:
      - .:/home/node/app
      - worker-scratch:/tmp/streamtube-worker
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[w]orker/main'"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${STORAGE_ACCESS_KEY_ID:-streamtube}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${STORAGE_SECRET_ACCESS_KEY:-streamtube}}
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-cors-proxy:
    image: nginx:1.29-alpine
    ports:
      - "9000:9000"
    volumes:
      - ./docker/minio/cors-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minio:
        condition: service_healthy

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/videos &&
        mc mb --ignore-existing local/thumbnails
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${STORAGE_ACCESS_KEY_ID:-streamtube}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${STORAGE_SECRET_ACCESS_KEY:-streamtube}}
    restart: "no"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:4.3.7-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-streamtube}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-streamtube}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  minio-data:
  rabbitmq-data:
  worker-scratch:
